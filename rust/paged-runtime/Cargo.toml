[package]
name = "dotcache-paged-runtime"
version = "0.1.0"
edition = "2021"
description = "Minimal page-native KV-cache runtime skeleton for DotCache experiments"
publish = false
build = "build.rs"

[features]
default = []
hf = ["dep:hf-hub", "dep:serde", "dep:serde_json", "dep:tokenizers"]
candle = ["hf", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
candle-metal = ["candle", "dep:candle-metal-kernels", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
candle-cuda = ["candle", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
candle-hip = ["candle"]
candle-accelerate = ["candle", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
qwen35-minimal = ["hf", "dep:candle-core", "dep:candle-nn"]
qwen35-minimal-hip = ["qwen35-minimal", "candle-core/hip", "candle-nn/hip"]
qwen35-minimal-cuda = ["qwen35-minimal", "candle-core/cuda", "candle-nn/cuda"]

[dependencies]
half = "2.4"
candle-core = { version = "0.10.2", path = "../../../candle/candle-core", optional = true }
candle-metal-kernels = { version = "0.10.2", path = "../../../candle/candle-metal-kernels", optional = true }
candle-nn = { version = "0.10.2", path = "../../../candle/candle-nn", optional = true }
candle-transformers = { version = "0.10.2", path = "../../../candle/candle-transformers", optional = true }
hf-hub = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokenizers = { version = "0.22", optional = true }
