[package]
name = "dotcache-model-store"
version = "0.1.0"
edition = "2021"
description = "Backend-aware prepared model package and weight view support for DotCache"
publish = false

[dependencies]
candle-core = { version = "0.10.2", path = "../../../candle/candle-core" }
dotcache-runtime-core = { path = "../runtime-core" }
half = "2.4"
hf-hub = "0.4"
libc = "0.2"
memmap2 = "0.9"
safetensors = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
