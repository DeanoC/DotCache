[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotcache"
version = "0.1.0"
description = "Compressed-domain KV-cache research runtime with HF model integration, MPS/CUDA backends, and vLLM scaffolding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
mps = [
  "torch>=2.5",
]
metal = [
  "pyobjc-core>=11.0",
  "pyobjc-framework-Metal>=11.0",
  "pyobjc-framework-Cocoa>=11.0",
]
hf = [
  "transformers>=5.5.0",
  "sentencepiece>=0.2.1",
  "safetensors>=0.7.0",
  # INT8 model weights + device_map="auto" path used by the paper benchmarks.
  "accelerate>=1.0",
  "bitsandbytes>=0.46",
  # PG-19 perplexity + any HF dataset-driven harness.
  "datasets>=4.0",
]
longbench = [
  "jieba>=0.42.1",
  "fuzzywuzzy>=0.18.0",
  "rouge>=1.0.1",
]
research = [
  "scikit-learn>=1.5",
]
vllm = [
  "torch>=2.5",
  "vllm>=0.18,<0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = [
  "dotcache",
  "dotcache.backends",
  "dotcache.backends.metal",
  "dotcache.integrations",
  "dotcache.integrations.vllm_adapter",
  "dotcache.modes",
]

[tool.setuptools.package-data]
"dotcache.backends.metal" = ["*.metal"]
